name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contracts (packages/contracts/generated)
        run: pnpm contracts:check

      - name: Contracts against the fixture corpus (Zod and ajv)
        run: pnpm contracts:test

      - name: Verify OpenAPI contract
        run: pnpm openapi:check

      - name: Verify AI discovery consistency
        run: pnpm ai:check

      - name: Content check (registry, /jobs namespace, internal-only keys, public denylist)
        run: pnpm content:check
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}

      - name: Registry and sitemap snapshot tests
        run: pnpm content:unit

      - name: Slop lint
        run: pnpm lint:slop

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Verify the WhatsApp chat copy is generated
        run: pnpm whatsapp:check

      - name: Verify Windmill scripts are generated
        run: pnpm windmill:build --check

      - name: Windmill talent tests (intake, acknowledgement, deliver, retention)
        run: pnpm windmill:test

      - name: Verify upload renewal
        run: pnpm forms:unit

      - name: Verify share images
        run: pnpm share:check

      - name: Build
        run: pnpm build

      - name: SEO check, including the jobs phone check (C7)
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000 && break; sleep 1; done
          pnpm seo:check http://localhost:3000

      - name: Public denylist in the built HTML, and no wage data in client chunks
        run: pnpm content:check
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}

      # The denylist step passes when the secret is unset; say so on the PR.
      - name: Warn when PUBLIC_DENYLIST is not set
        if: always()
        run: |
          if [ -z "$PUBLIC_DENYLIST" ]; then
            echo "::warning title=Public denylist skipped::PUBLIC_DENYLIST is not set in this repo's Actions secrets, so the internal-names scan did not run."
          fi
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
