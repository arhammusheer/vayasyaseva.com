name: IndexNow

# After each successful production deploy, submit only the pages whose content
# changed (scripts/indexnow.mjs --changed). Fingerprints are an artifact of the
# last successful run (actions/cache does not work on deployment_status, which
# has no branch ref); with none (first run, or expired) every page is submitted.
on: deployment_status

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow indexnow.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ] && gh run download "$last" -R "$GITHUB_REPOSITORY" -n indexnow-state; then
            echo "Fingerprints from run $last"
          else
            echo "No previous fingerprints; submitting every page"
          fi

      # Deployment URLs are behind Vercel protection, so pages are read from the
      # public domain; give the production alias a moment to point at this deploy.
      - name: Wait for the production domain
        run: sleep 30

      - name: Check production SEO
        run: node scripts/seo-check.mjs https://www.vayasyaseva.com

      - name: Submit changed pages
        run: node scripts/indexnow.mjs --changed .indexnow-state.json

      - name: Save fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow-state.json
          include-hidden-files: true
          retention-days: 90
