name: Wage monitor

# Manual fallback for the compliance source monitor (scripts/wage-monitor/,
# docs/wage-monitor.md). The daily run is a Kubernetes CronJob that notifies
# Chatwoot (vayasya-infra apps/compliance-monitor); this workflow runs the
# same command by hand and reports to GitHub issues labelled wage-monitor
# instead. Its snapshot lives in the Actions cache, separate from the
# cluster's, so the workflow never writes to the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compare and print, but open no issues and keep the snapshot"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: wage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore snapshot
        uses: actions/cache/restore@v4
        with:
          path: .wage-monitor
          key: wage-monitor-state-${{ github.run_id }}
          restore-keys: wage-monitor-state-

      - name: Check wage sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/wage-monitor/index.mjs --notify github $DRY_RUN | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save snapshot
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .wage-monitor
          key: wage-monitor-state-${{ github.run_id }}
