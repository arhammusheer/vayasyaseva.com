name: Wage monitor

# Manual fallback for the compliance source monitor (scripts/wage-monitor/,
# docs/wage-monitor.md). The daily run is a Kubernetes CronJob that posts to
# the notification hub (vayasya-infra apps/compliance-monitor); this workflow runs the
# same command by hand and reports to GitHub issues labelled wage-monitor
# instead. Its snapshot lives in the Actions cache, separate from the
# cluster's, so the workflow never writes to the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compare and print, but open no issues and keep the snapshot"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: wage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore snapshot
        uses: actions/cache/restore@v4
        with:
          path: .wage-monitor
          key: wage-monitor-state-${{ github.run_id }}
          restore-keys: wage-monitor-state-

      - name: Check wage sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/wage-monitor/index.mjs --notify github $DRY_RUN | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save snapshot
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .wage-monitor
          key: wage-monitor-state-${{ github.run_id }}

  # Tells the notification hub (docs/notification-hub.md) when this run failed:
  # an instant push with the run as its link. Needs the repository secret
  # NOTIFY_INGEST_SECRET (an owner step); without it the job does nothing.
  notify-failure:
    needs: [monitor]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Tell the notification hub
        env:
          NOTIFY_INGEST_SECRET: ${{ secrets.NOTIFY_INGEST_SECRET }}
          NOTIFY_URL: https://hooks.vayasyaseva.com/api/r/webhook/vspl-notify
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEDUPE_KEY: compliance:monitor_failed:github:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          if [ -z "$NOTIFY_INGEST_SECRET" ]; then
            echo "NOTIFY_INGEST_SECRET is not set: not notifying"
            exit 0
          fi
          body=$(jq -n --arg key "$DEDUPE_KEY" --arg url "$RUN_URL" '{
            v: 1, source: "compliance", type: "compliance.monitor_failed", severity: "warning", dedupeKey: $key,
            title: "Compliance monitor failed (GitHub run)",
            summary: "The manual wage monitor run in GitHub Actions failed. Open the run for the step.",
            link: { label: "GitHub run", url: $url }
          }')
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$NOTIFY_URL" \
            -H "content-type: application/json" -H "x-vspl-notify-secret: $NOTIFY_INGEST_SECRET" -d "$body")
          echo "notification hub answered $status"
