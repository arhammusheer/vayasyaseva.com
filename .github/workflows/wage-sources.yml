name: Wage sources

# Daily check of every document and listing page the minimum wage pages cite
# (scripts/wage-sources-check.mjs). Read-only: it fetches public government
# pages and compares hashes. A failed run means a document changed, moved or
# stopped loading, and the figures need a human re-check. The same script
# runs from n8n or a k8s CronJob when the site moves off Vercel.
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check wage sources
        run: |
          set -o pipefail
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/wage-sources-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
