{
  "summary": "Leads · send a rate alert",
  "description": "One state's new minimum wage rates to its confirmed alert subscribers, each once per revision (the in-force date). Run by hand after the wage update is live: pnpm alerts:send <state>. dry_run (the default) only counts.",
  "lock": "",
  "kind": "script",
  "language": "bun",
  "schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "properties": {
      "state": {
        "type": "string",
        "description": "The wage page's state slug, e.g. uttarakhand."
      },
      "revision": {
        "type": "string",
        "description": "What makes this change one alert: the date the new rates are in force from, e.g. 2026-10-01."
      },
      "subject": {
        "type": "string",
        "description": "The email's subject."
      },
      "lines": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "description": "What changed, a paragraph each, as the wage page states it."
      },
      "dry_run": {
        "type": "boolean",
        "default": true,
        "description": "Count who would get it; send nothing."
      },
      "limit": {
        "type": "integer",
        "description": "At most this many in one run (default 500)."
      }
    },
    "required": [
      "state",
      "revision",
      "subject",
      "lines"
    ]
  }
}
