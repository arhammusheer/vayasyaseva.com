{
  "summary": "Talent · SMS delivery report",
  "description": "Fast2SMS's delivery reports (POST /webhook/fast2sms-dlr): checks x-vspl-dlr-secret and marks the acknowledgement delivered or failed; sync_crm carries it to Twenty.",
  "lock": "",
  "kind": "script",
  "language": "bun",
  "schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "properties": {
      "authorized": {
        "type": "boolean",
        "description": "Set by the preprocessor: the secret header matched."
      },
      "body": {
        "type": "object",
        "description": "The report's request id, status and times (no phone number)."
      }
    },
    "required": [
      "authorized",
      "body"
    ]
  },
  "has_preprocessor": true
}
